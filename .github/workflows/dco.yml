name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            email=$(git log -1 --format='%ae' "$sha")
            signoffs=$(git show -s --format=%B "$sha" | sed -n 's/^Signed-off-by: .*<\(.*\)>[[:space:]]*$/\1/Ip')
            if ! printf '%s\n' "$signoffs" | grep -qixF -- "$email"; then
              echo "::error::commit $sha is missing 'Signed-off-by: ... <$email>' (use git commit -s)"
              status=1
            fi
          done
          exit "$status"
